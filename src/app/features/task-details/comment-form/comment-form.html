<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">
      <input
        type="text"
        formControlName="author"
        placeholder="Your name"
        class="w-full sm:w-56 rounded-md border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
      />
      <textarea
        formControlName="content"
        rows="2"
        [placeholder]="placeholder()"
        class="w-full rounded-md border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
      ></textarea>

      <div class="flex gap-2">
        <button
          type="submit"
          class="px-3 py-1 text-xs rounded-md bg-brand-600 text-white hover:bg-brand-700 disabled:opacity-50"
          [disabled]="form.invalid"
        >
          {{ submitLabel() }}
        </button>
        @if (showCancel()) {
          <button
            type="button"
            class="px-3 py-1 text-xs rounded-md border border-slate-300 text-slate-600 hover:bg-slate-50"
            (click)="cancelRequested.emit()"
          >
            Cancel
          </button>
        }
      </div>
    </form>
