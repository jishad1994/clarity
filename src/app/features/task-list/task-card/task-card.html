<article class="bg-white border border-slate-200 rounded-lg p-4 flex flex-col gap-2 hover:shadow-sm transition-shadow">
    <div class="flex items-start justify-between gap-2">
        <!-- <h3 class="font-medium text-slate-800 cursor-pointer hover:text-brand-700" (click)="view.emit()">
          {{ task().title }}
        </h3> -->
        <h3 class="font-medium text-slate-800">
            {{ task().title }}
        </h3>
        <app-status-badge [status]="task().status" />
    </div>

    <p class="text-sm text-slate-500 line-clamp-2">{{ task().description | stripHtml }}</p>

    <div class="flex items-center justify-between mt-2 text-xs text-slate-400">
        <span>Due {{ task().deadline | date: 'mediumDate' }}</span>

        <div class="flex gap-3">
            <button type="button" class="text-brand-600 hover:underline" (click)="view.emit()">View</button>
            <button type="button" class="text-slate-600 hover:underline" (click)="edit.emit()">Edit</button>
            <button type="button" class="text-red-600 hover:underline" (click)="delete.emit()">Delete</button>
        </div>
    </div>
</article>
