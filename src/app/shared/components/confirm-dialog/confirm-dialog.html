<div class="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50">
      <div class="bg-white rounded-lg shadow-lg w-full max-w-sm p-5">
        <h2 class="font-medium text-slate-800">{{ title() }}</h2>
        <p class="text-sm text-slate-500 mt-1">{{ message() }}</p>

        <div class="flex justify-end gap-2 mt-5">
          <button
            type="button"
            class="px-3 py-1.5 text-sm rounded-md border border-slate-300 text-slate-700 hover:bg-slate-50"
            (click)="cancelRequest.emit()"
          >
            Cancel
          </button>
          <button
            type="button"
            class="px-3 py-1.5 text-sm rounded-md bg-red-600 text-white hover:bg-red-700"
            (click)="confirm.emit()"
          >
            {{ confirmLabel() }}
          </button>
        </div>
      </div>
    </div>
